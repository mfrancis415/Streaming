<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TLNG Squad Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      transition: background-color 0.5s, color 0.5s;
    }

    body.dark-mode {
      background-color: #121212;
      color: white;
    }

    body.light-mode {
      background-color: #f4f4f4;
      color: #333;
    }

    .main-stream {
      margin: 20px auto;
      width: 80%;
      animation: fadeIn 1s ease-in;
    }

    .streamers {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      animation: slideUp 1s ease-out;
      flex-wrap: wrap;
    }

    .streamer {
      width: 150px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .streamer img {
      width: 100%;
      border-radius: 10px;
    }

    .streamer:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    button {
      margin: 20px;
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #555;
      color: white;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #777;
    }

    #countdown {
      font-size: 1.2em;
      margin-top: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 600px) {
      .streamers {
        flex-direction: column;
        align-items: center;
      }
      .streamer {
        width: 80%;
        margin-bottom: 20px;
      }
      .main-stream iframe {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <h1>🎮 TLNG Squad Stream</h1>
  <button onclick="toggleTheme()">Toggle Dark/Light Mode</button>
  <div id="countdown"></div>

  <!-- Main Stream Embed -->
  <div class="main-stream">
    <iframe
      src="https://player.twitch.tv/?channel=tlng_winner&parent=https://mfrancis415.github.io/Streaming/"
      frameborder="0"
      allowfullscreen="true"
      scrolling="no"
      height="480"
      width="854">
    </iframe>
  </div>

  <!-- Other Streamers -->
  <div class="streamers">
    <div class="streamer">
      <a href="https://m.twitch.tv/tlnggarrnet237/home?tt_content=channel&tt_medium=mobile_web_share" target="_blank">
        <img src="tlnggarrnet237.jpg" alt="TLNG Garrnet">
      </a>
    </div>
    <!-- Add 3 more streamers below using the same format -->
  </div>

  <script>
    // Theme toggle with localStorage
    function toggleTheme() {
      if (document.body.classList.contains('dark-mode')) {
        document.body.classList.remove('dark-mode');
        document.body.classList.add('light-mode');
        localStorage.setItem('theme', 'light');
      } else {
        document.body.classList.remove('light-mode');
        document.body.classList.add('dark-mode');
        localStorage.setItem('theme', 'dark');
      }
    }

    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.body.classList.add('light-mode');
    } else {
      document.body.classList.add('dark-mode');
    }

    // Countdown Timer
    const countdownElement = document.getElementById('countdown');
    const targetDate = new Date("August 22, 2025 20:00:00").getTime(); // 8 PM EDT

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        countdownElement.innerHTML = "🎉 We're live now!";
        return;
      }

      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdownElement.innerHTML = `⏳ Next stream starts in ${hours}h ${minutes}m ${seconds}s`;
    }

    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>

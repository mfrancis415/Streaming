<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Heat Certified</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Brusher&display=swap" rel="stylesheet">

  <style>
    body {
  margin: 0;
  font-family: 'Anton', sans-serif;
  background-color: #121212;
  color: #FFD700;
  text-align: center;
  transition: background-color 0.5s ease, color 0.5s ease;
}

.logo-container {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  padding: 20px;
}

.logo {
  max-width: 180px;
  height: auto;
  animation: fadeIn 1s ease-in;
}

}
    .main-stream {
      margin: 20px auto;
      width: 80%;
    }

    .streamers {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
      animation: slideUp 1s ease-out;
      flex-wrap: wrap;
    }

    .streamer {
      width: 200px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .streamer img {
      width: 100%;
      border-radius: 10px;
    }

    .streamer:hover {
      transform: scale(1.08);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }
.photo-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
  background-color: black;
}

.photo-row img {
  max-width: 22%;
  height: auto;
  border-radius: 8px;
}

    #countdown {
      font-size: 1.2em;
      margin-top: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 600px) {
      .streamers {
        flex-direction: column;
        align-items: center;
      }
      .streamer {
        width: 80%;
        margin-bottom: 20px;
      }
      .main-stream iframe {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <h1>
    <div class="logo-container">
  <img src="logo.png" alt="TLNG Logo" class="logo">
</div>
  </h1>
  <div id="countdown"></div>

  <!-- Main Stream Embed -->
 <!-- Photo Row -->
<div class="photo-row">
  <img src="tlnggarrnet237.jpg" alt="Photo 1">
  <img src="tlnggarrnet237.jpg" alt="Photo 2">
  <img src="tlnggarrnet237.jpg" alt="Photo 3">
  <img src="tlnggarrnet237.jpg" alt="Photo 4">
</div>

<!-- Streamers List -->
<ul class="streamers-list">
  <li><a href="https://m.twitch.tv/tlnggarrnet237/" target="_blank">Streamer 1</a></li>
  <li><a href="https://m.twitch.tv/tlnggarrnet237/" target="_blank">Streamer 2</a></li>
  <li><a href="https://m.twitch.tv/tlnggarrnet237/" target="_blank">Streamer 3</a></li>
  <li><a href="https://m.twitch.tv/tlnggarrnet237/" target="_blank">Streamer 4</a></li>
</ul>

    <!-- Add more streamers here -->
  </div>

  <script>
    // Countdown Timer
    const countdownElement = document.getElementById('countdown');
    const targetDate = new Date("August 22, 2025 20:00:00").getTime(); // 8 PM EDT

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        countdownElement.innerHTML = "🎉 We're live now!";
        return;
      }

      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdownElement.innerHTML = `⏳ Next stream starts in ${hours}h ${minutes}m ${seconds}s`;
    }

    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>

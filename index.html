<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Heat Certified</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Brusher&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Anton', sans-serif;
      background-color: #121212;
      color: #FFD700;
      text-align: center;
      transition: background-color 0.5s ease, color 0.5s ease;
    }
  h1 {
      font-family: 'Brusher', cursive;
      font-size: 3em;
      margin-top: 20px;
      animation: fadeIn 1s ease-in;
    }
   .logo-container {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  padding: 20px;
}

.logo {
  max-width: 180px;
  height: auto;
  animation: fadeIn 1s ease-in;
}

    .main-stream {
      margin: 20px auto;
      width: 80%;
    }

    .streamer-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
  padding: 20px;
}

.stream-box {
  width: 300px;
  background-color: #1e1e1e;
  border-radius: 10px;
  padding: 10px;
  color: #FFD700;
  font-family: 'Anton', sans-serif;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
  transition: transform 0.3s ease;
}

.stream-box:hover {
  transform: scale(1.03);
}

.stream-box p {
  margin-top: 10px;
  font-size: 1em;
}

    #countdown {
      font-size: 1.2em;
      margin-top: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 600px) {
      .streamers {
        flex-direction: column;
        align-items: center;
      }
      .streamer {
        width: 80%;
        margin-bottom: 20px;
      }
      .main-stream iframe {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <div class="logo-container">
  <img src="logo.png" alt="TLNG Logo" class="logo">
</div>

  <div id="countdown"></div>

  <!-- Main Stream Embed -->
  <div class="main-stream">
    <iframe
      src="https://player.twitch.tv/?channel=heatcertifiedtv&parent=mfrancis415.github.io"
      frameborder="0"
      allowfullscreen="true"
      scrolling="no"
      height="480"
      width="854">
    </iframe>
  </div>

 <!-- Streamer Grid -->
<div class="streamer-grid">
  <!-- TLNG Garrnet -->
  <div class="stream-box">
    <iframe
      src="https://player.twitch.tv/?channel=tlnggarrnet2377&parent=mfrancis415.github.io"
      frameborder="0"
      allowfullscreen
      scrolling="no"
      height="300"
      width="100%">
    </iframe>
    <p>TLNG Garrnet</p>
  </div>

  <!-- Runlake0507 -->
  <div class="stream-box">
    <iframe
      src="https://player.twitch.tv/?channel=runlake0507&parent=mfrancis415.github.io"
      frameborder="0"
      allowfullscreen
      scrolling="no"
      height="300"
      width="100%">
    </iframe>
    <p>Runlake0507</p>
  </div>

  <!-- SquadUp_23 -->
  <div class="stream-box">
    <iframe
      src="https://player.twitch.tv/?channel=squadup_23&parent=mfrancis415.github.io"
      frameborder="0"
      allowfullscreen
      scrolling="no"
      height="300"
      width="100%">
    </iframe>
    <p>SquadUp_23</p>
  </div>

  <!-- Placeholder 1 -->
  <div class="stream-box">
    <iframe
      src="https://player.twitch.tv/?channel=placeholder1&parent=mfrancis415.github.io"
      frameborder="0"
      allowfullscreen
      scrolling="no"
      height="300"
      width="100%">
    </iframe>
    <p>Streamer Placeholder 1</p>
  </div>

  <!-- Placeholder 2 -->
  <div class="stream-box">
    <iframe
      src="https://player.twitch.tv/?channel=placeholder2&parent=mfrancis415.github.io"
      frameborder="0"
      allowfullscreen
      scrolling="no"
      height="300"
      width="100%">
    </iframe>
    <p>Streamer Placeholder 2</p>
  </div>
</div>

  </div>

  <script>
    // Countdown Timer
    const countdownElement = document.getElementById('countdown');
    const targetDate = new Date("August 23, 2025 20:00:00").getTime(); // 8 PM EDT

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        countdownElement.innerHTML = "🎉 We're live now!";
        return;
      }

      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdownElement.innerHTML = `⏳ Next stream starts in ${hours}h ${minutes}m ${seconds}s`;
    }

    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
